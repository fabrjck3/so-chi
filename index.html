<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Sổ Chi</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://api.anthropic.com https://*.workers.dev; manifest-src 'self'; worker-src 'self'">
<meta name="theme-color" content="#070b12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sổ Chi">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/app-180.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <div class="pill" id="pill" aria-hidden="true"></div>
  <main>
    <section class="view on" id="v-home" aria-label="Hôm nay"></section>
    <section class="view" id="v-log" aria-label="Sổ chi"></section>
    <section class="view" id="v-stats" aria-label="Thống kê"></section>
    <section class="view" id="v-wallet" aria-label="Ví"></section>
    <section class="view" id="v-settings" aria-label="Cài đặt"></section>
  </main>
  <nav class="dock" aria-label="Điều hướng">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-act="tab" data-tab="home" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg><span>Hôm nay</span></button>
      <button class="tab" role="tab" data-act="tab" data-tab="log" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg><span>Sổ</span></button>
      <button class="tab" role="tab" data-act="tab" data-tab="stats" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg><span>Thống kê</span></button>
      <button class="tab" role="tab" data-act="tab" data-tab="wallet" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M4 7a2 2 0 0 1 2-2h12v3M4 7v10a2 2 0 0 0 2 2h14V8H6a2 2 0 0 1-2-2zM16 13.5h.01"/></svg><span>Ví</span></button>
      <button class="tab" role="tab" data-act="tab" data-tab="settings" aria-selected="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg><span>Cài đặt</span></button>
    </div>
    <button class="plus" data-act="add" aria-label="Thêm khoản chi"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  </nav>
  <div class="scrim" id="scrim" data-act="close"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
  <div class="toast" id="toast" role="status"></div>
</div>
<input type="file" id="file" accept="application/json,.json" hidden>
<script type="module" src="js/app.js"></script>
</body>
</html>
